<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panalo July Summary</title>
<style>
  @font-face {
    font-family: 'Stats';
    src: url('../../assets/fonts/Stats/Stats.otf') format('opentype');
    font-weight: 400;
  }

  @font-face {
    font-family: 'Quicking Regular';
    src: url('../../assets/fonts/Stats/QuickingRegular.otf') format('opentype');
    font-weight: 400;
  }

  :root {
    --background: linear-gradient(180deg, #2ab859 0%, #072b14 100%);
    --dark-green: #ffffff;
    --muted: #2f6c43;
    --r1-dark: #193e2d;
    --r2-dark: #255739;
    --r3-dark: #397650;
    --glass-red: rgba(255, 0, 0, 0.4);
    --glass-gold: rgba(255, 215, 0, 0.4);
    --glass-silver: rgba(192, 192, 192, 0.4);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #163e29;
    font-family: 'Stats', sans-serif;
  }

  .card {
    width: 480px;
    margin: auto;
    position: relative;
    background: var(--background);
    box-shadow: 0 0 40px rgba(0,0,0,0.15);
    min-height: 620px;
    padding: 30px 0px 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background: url('bg.png') center/cover no-repeat;
    opacity: 0.8;
    transform: scale(1.5);
    z-index: 0;
  }

  .card > * {
    position: relative;
    z-index: 1;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 12px auto 0 auto;
    width: 100%;
    flex-direction: column;
    gap: 0;
  }

  .header h1 {
    margin: 0;
    font-size: 70px;
    color: #ffffff;
    font-weight: 400;
    letter-spacing: 1px;
    line-height: 1;
  }

  .subtitle {
    margin: 0;
    padding: 0;
    max-width: 420px;
    color: rgba(255, 255, 255, 0.88);
    font-family: 'Quicking Regular', 'Stats', sans-serif;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: 0.2px;
  }

  .podium-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 8px;
    flex-wrap: nowrap;
    padding-top: 0;
  }

  .medal-col {
    width: 144px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .icon-slot {
    position: relative;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.96);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--rc-dark);
    margin-bottom: 8px;
    overflow: visible;
  }

  /* Center the badge overlay on the avatar icon and scale it for better placement. */
  .badge {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 38px;
    height: 38px;
    transform: translate(-50%, -45%) scale(4.5);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    pointer-events: none;
  }

  .badge.second {
    transform: translate(-50%, -45%) scale(4.5);
  }

  .badge.third {
    transform: translate(-50%, -45%) scale(4.5);
  }

  .podium-bar {
    width: 100%;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
    border: none;

    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
    padding: 10px 8px 14px;
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.14);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }

  .rank-1 .podium-bar {
    background: linear-gradient(180deg, var(--glass-red) 0%, rgba(255, 255, 255, 0.1) 100%);
    border-color: rgba(255, 255, 255, 0.18);
  }

  .rank-2 .podium-bar {
    background: linear-gradient(180deg, var(--glass-gold) 0%, rgba(255, 255, 255, 0.1) 100%);
    border-color: rgba(255, 255, 255, 0.18);
  }

  .rank-3 .podium-bar {
    background: linear-gradient(180deg, var(--glass-silver) 0%, rgba(255, 255, 255, 0.1) 100%);
    border-color: rgba(255, 255, 255, 0.18);
  }

  .podium-bar .count {
    font-family: 'Quicking Regular', 'Stats', sans-serif;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 0.8px;
    margin-top: 4px;
    margin-bottom: 4px;
    padding: 0;
    background: transparent;
    min-width: 0;
    text-align: center;
    line-height: 1;
  }

  .podium-bar .pname {
    font-family: 'Quicking Regular', 'Stats', sans-serif;
    font-weight: 400;
    margin-top: 0;
    text-align: center;
    font-size: 16px;
    line-height: 1.1;
  }

  .rank-1 { --rc-dark: var(--r1-dark); }
  .rank-2 { --rc-dark: var(--r2-dark); }
  .rank-3 { --rc-dark: var(--r3-dark); }

  .rank-1 .podium-bar { min-height: 230px; }
  .rank-2 .podium-bar { min-height: 170px; }
  .rank-3 .podium-bar { min-height: 128px; }

  .rank-1 .podium-bar .count,
  .rank-2 .podium-bar .count,
  .rank-3 .podium-bar .count {
    font-size: 30px;
  }

  .rank-1 .icon-slot { width: 72px; height: 72px; }
  .rank-2 .icon-slot { width: 64px; height: 64px; }
  .rank-3 .icon-slot { width: 60px; height: 60px; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>{{HEADER_TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
    </div>
    <div class="podium-row">
      {{CARDS}}
    </div>
  </div>
</body>
</html>

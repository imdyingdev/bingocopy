<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panalo July No Win</title>
<style>
  @font-face {
    font-family: 'Stats';
    src: url('../../assets/fonts/Stats/Stats.otf') format('opentype');
    font-weight: 400;
  }

  @font-face {
    font-family: 'Quicking Regular';
    src: url('../../assets/fonts/Stats/QuickingRegular.otf') format('opentype');
    font-weight: 400;
  }

  :root {
    --background: linear-gradient(180deg, #0f8d39 0%, #25af5a 100%);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.75);
    --panel: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.14);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #163e29;
    font-family: 'Stats', sans-serif;
  }

  .card {
    width: 480px;
    margin: auto;
    position: relative;
    background: var(--background);
    box-shadow: 0 0 40px rgba(0,0,0,0.15);
    min-height: 620px;
    padding: 20px 24px 28px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    background: url('bg.png') center/cover no-repeat;
    opacity: 0.8;
    transform: scale(1.5);
    z-index: 0;
  }

  .card > * {
    position: relative;
    z-index: 1;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 40px auto 20px auto;
    width: 100%;
    flex-direction: column;
    gap: 10px;
  }

  .header h1 {
    margin: 0;
    font-size: 70px;
    color: var(--text);
    font-weight: 400;
    letter-spacing: 1px;
    line-height: 1;
  }

  .subtitle {
    max-width: 420px;
    color: var(--muted);
    font-family: 'Quicking Regular', 'Stats', sans-serif;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: 0.3px;
    margin: 0 auto;
  }

  .grid {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 200px));
    justify-content: center;
    justify-items: center;
    gap: 16px;
    width: 100%;
    padding-bottom: 12px;
  }

  .player-item {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    min-height: 100px;
    justify-content: center;
  }

  .icon-slot {
    width: 80px;
    height: 80px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.96);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .pname {
    font-family: 'Quicking Regular', 'Stats', sans-serif;
    font-weight: 700;
    margin: 0;
    text-align: center;
    font-size: 20px;
    line-height: 1.2;
    color: #ffffff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    width: 100%;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>NO WIN IN {{MONTH}}</h1>
      <p class="subtitle">No win this month? See you coming back next month for another shot!</p>
    </div>
    <div class="grid">
      {{CARDS}}
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panalo July Most Confidence Win</title>
<style>
  @font-face {
    font-family: 'Stats';
    src: url('../../assets/fonts/Stats/Stats.otf') format('opentype');
    font-weight: 400;
  }

  @font-face {
    font-family: 'Quicking Regular';
    src: url('../../assets/fonts/Stats/QuickingRegular.otf') format('opentype');
    font-weight: 400;
  }

  :root {
    --background: linear-gradient(180deg, #0f8d39 0%, #25af5a 100%);
    --dark-green: #ffffff;
    --muted: #2f6c43;
    --r1-dark: #193e2d;
    --r2-dark: #255739;
    --r3-dark: #397650;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #163e29;
    font-family: 'Stats', sans-serif;
  }

  .card {
    width: 480px;
    margin: auto;
    position: relative;
    background: var(--background);
    box-shadow: 0 0 40px rgba(0,0,0,0.15);
    min-height: 620px;
    padding: 20px 0px 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0px;
    right: 0;
    bottom: 0;
    left: 0;
    background: url('bg.png') center/cover no-repeat;
    opacity: 0.8;
    transform: scale(1.5);
    z-index: 0;
  }

  .card > * {
    position: relative;
    z-index: 1;
  }

  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 40px auto 0 auto;
    width: 100%;
    gap: 6px;
  }

  .header h1 {
    margin: 0 auto;
    font-size: 64px;
    color: #ffffff;
    font-weight: 400;
    letter-spacing: 1px;
    line-height: 1;
  }

  .subtitle {
    margin: 6px 0 0;
    color: rgba(255, 255, 255, 0.88);
    font-family: 'Quicking Regular', 'Stats', sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: 0.2px;
    max-width: 420px;
  }

  .podium-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 6px;
    padding: 20px 0 0;
    margin-bottom: 20px;
  }

  .medal-col {
    width: 92%;
    max-width: 380px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 4px 0;
    margin: 0 auto;
  }

  .player-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .icon-slot {
    width: 72px;
    height: 72px;
    min-width: 72px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.96);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .player-details {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }

  .player-details .pname {
    font-family: 'Quicking Regular', 'Stats', sans-serif;
    font-weight: 400;
    margin: 0;
    text-align: center;
    font-size: 18px;
    line-height: 1.1;
    color: #ffffff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .count {
    font-family: 'Quicking Regular', 'Stats', sans-serif;
    font-size: 32px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.5px;
    text-align: right;
    min-width: 54px;
    margin-left: 0;
  }

  .rank-1 { --rc-dark: var(--r1-dark); }
  .rank-2 { --rc-dark: var(--r2-dark); }
  .rank-3 { --rc-dark: var(--r3-dark); }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>TOP 5 Overall Players</h1>
      <p class="subtitle">Wilson Lower Bound ranks players based on both win rate and consistency.</p>
    </div>
    <div class="podium-row">
      {{CARDS}}
    </div>
  </div>
</body>
</html>

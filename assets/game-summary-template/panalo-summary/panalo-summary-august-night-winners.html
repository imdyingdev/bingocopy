<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panalo August Night Winners</title>
<style>
  @font-face {
    font-family: 'Stats';
    src: url('../../assets/fonts/Stats/Stats.otf') format('opentype');
    font-weight: 400;
  }

  @font-face {
    font-family: 'Quicking Regular';
    src: url('../../assets/fonts/Stats/QuickingRegular.otf') format('opentype');
    font-weight: 400;
  }

  :root {
    --background: linear-gradient(180deg, #0f8d39 0%, #25af5a 100%);
    --dark-green: #ffffff;
    --muted: #2f6c43;
    --r1-dark: #193e2d;
    --r2-dark: #255739;
    --r3-dark: #397650;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #163e29;
    font-family: 'Stats', sans-serif;
  }

  .card {
    width: 480px;
    margin: auto;
    position: relative;
    background: var(--background);
    box-shadow: 0 0 40px rgba(0,0,0,0.15);
    min-height: 620px;
    padding: 20px 0px 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0px;
    right: 0;
    bottom: 0;
    left: 0;
    background: url('bg.png') center/cover no-repeat;
    opacity: 0.8;
    transform: scale(1.5);
    z-index: 0;
  }

  .card > * {
    position: relative;
    z-index: 1;
  }

  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin: 40px auto 0 auto;
    width: 100%;
    gap: 6px;
  }

  .header h1 {
    margin: 0 auto;
    font-size: 56px;
    color: #ffffff;
    font-weight: 400;
    letter-spacing: 1px;
    line-height: 1;
  }

  .subtitle {
    margin: 6px 0 0;
    color: rgba(255, 255, 255, 0.88);
    font-family: 'Quicking Regular', 'Stats', sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.25;
    letter-spacing: 0.2px;
    max-width: 420px;
  }

  .time-periods {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 20px 0;
    margin: 0 auto;
    width: 92%;
    max-width: 380px;
  }

  .time-period {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .period-label {
    text-align: center;
    color: #ffffff;
    font-family: 'Quicking Regular', 'Stats', sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .winners-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 8px;
  }

  .player-item {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    flex: 1;
  }

  .icon-slot {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.96);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .player-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    min-width: 0;
    flex: 1;
  }

  .player-name {
    font-family: 'Quicking Regular', 'Stats', sans-serif;
    font-weight: 400;
    margin: 0;
    font-size: 14px;
    line-height: 1.1;
    color: #ffffff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .player-count {
    font-family: 'Quicking Regular', 'Stats', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  .rank-1 { --rc-dark: var(--r1-dark); }
  .rank-2 { --rc-dark: var(--r2-dark); }
  .rank-3 { --rc-dark: var(--r3-dark); }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>NIGHT WINNERS</h1>
      <p class="subtitle">Top winners from evening (6PM-12AM) and midnight (12AM-6AM) PH time.</p>
    </div>
    
    <div class="time-periods">
      <div class="time-period">
        <div class="period-label">EVENING (6PM-12AM)</div>
        {{EVENING_CARDS}}
      </div>
      
      <div class="time-period">
        <div class="period-label">MIDNIGHT (12AM-6AM)</div>
        {{MIDNIGHT_CARDS}}
      </div>
    </div>
  </div>
</body>
</html>

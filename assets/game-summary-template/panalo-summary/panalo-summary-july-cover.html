<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panalo July Recap</title>
<style>
  @font-face {
    font-family: 'Stats';
    src: url('../../assets/fonts/Stats/Stats.otf') format('opentype');
    font-weight: 400;
  }

  :root {
    --background: linear-gradient(180deg, #2bc064 0%, #2bc064 100%);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #163e29;
    font-family: 'Stats', sans-serif;
  }

  .card {
    width: 720px;
    height: 720px;
    margin: auto;
    position: relative;
    background: var(--background);
    box-shadow: 0 0 40px rgba(0,0,0,0.15);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url('recap.png') center/cover no-repeat;
    opacity: 0.98;
    z-index: 0;
  }

  .card > * {
    position: relative;
    z-index: 1;
  }

  .header {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 24px;
  }

  .header h1 {
    margin: 0 auto;
    font-size: 144px;
    color: #ffffff;
    font-weight: 400;
    letter-spacing: 1px;
    line-height: 0.88;
    white-space: pre-line;
    text-align: center;
    max-width: 520px;
    width: auto;
  }

  .header h1 span.month {
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>BINGO FOREVER!
<span class="month">{{MONTH}} RECAP</span></h1>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panalo July Game Time</title>
<style>
  @font-face {
    font-family: 'Quicking';
    src: url('../../assets/fonts/Stats/QuickingRegular.otf') format('opentype');
    font-weight: 400;
  }

  :root {
    --background: linear-gradient(180deg, #2bc064 0%, #2bc064 100%);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #163e29;
    font-family: 'Quicking', sans-serif;
  }

  .card {
    width: 720px;
    height: 720px;
    margin: auto;
    position: relative;
    background: var(--background);
    box-shadow: 0 0 40px rgba(0,0,0,0.15);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url('recap.png') center/cover no-repeat;
    opacity: 0.98;
    z-index: 0;
  }

  .card > * {
    position: relative;
    z-index: 1;
  }

  .stats {
    width: 92%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    justify-items: center;
    align-items: center;
  }

  .stat-card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
    backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    height: 220px;
    width: 100%;
    max-width: 480px;
  }

  .stat-label {
    color: rgba(255,255,255,0.88);
    font-size: 24px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
    font-weight: 700;
    text-align: center;
  }

  .stat-value {
    font-size: 96px;
    color: #ffffff;
    font-weight: 800;
    line-height: 1;
    text-align: center;
  }

  .subtitle {
    margin-top: 32px;
    color: rgba(255,255,255,0.82);
    font-size: 18px;
    text-align: center;
    max-width: 620px;
    line-height: 1.4;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Longest Game</div>
        <div class="stat-value">{{LONGEST_GAME}}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Fastest Game</div>
        <div class="stat-value">{{FASTEST_GAME}}</div>
      </div>
    </div>
    <div class="subtitle">Bot-only game time statistics for completed games with valid winners (15+ balls drawn).</div>
  </div>
</body>
</html>
